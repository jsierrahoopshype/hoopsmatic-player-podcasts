name: update

# Twice a day at 06:37 and 18:37 UTC, on odd minutes because GitHub starts
# scheduled runs late (or skips them) when everyone's :00/:15/:30/:45 jobs
# pile up. Two backup slots, 09:41 and 21:41 UTC, run only when no run has
# succeeded in the last 6 hours (a skipped or very late main slot); a second
# run the same day only refreshes that day's numbers. Each run reads every
# show's public YouTube feeds and a yt-dlp listing of its uploads from the
# last 90 days (no key), saves the day's view snapshot, rebuilds the site and
# deploys it to GitHub Pages (hoopsmatic.com/player-podcasts through the
# HoopsMatic Worker). "Run workflow" on the Actions tab starts one by hand.
# Mondays (first run of the day), and whenever run by hand with "listing"
# ticked, it first runs the full yt-dlp listing of every tab (every upload's
# length, views and date, Shorts included, plus subscriber counts). If YouTube
# blocks that from GitHub's servers the step warns and the run carries on with
# the last good data.
# A push to main rebuilds and redeploys from the committed data only.

on:
  schedule:
    - cron: "37 6 * * *"     # main
    - cron: "37 18 * * *"    # main
    - cron: "41 9 * * *"     # backup: only if nothing succeeded in the last 6 hours
    - cron: "41 21 * * *"    # backup
  workflow_dispatch:
    inputs:
      listing:
        description: "Also run the full yt-dlp listing (the weekly job / backfill)"
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

# One run at a time, and never cancel one mid-commit.
concurrency:
  group: player-podcasts
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    outputs:
      skip: ${{ steps.gate.outputs.skip }}
    steps:
      - uses: actions/checkout@v4

      # Backup slots stand down when a run succeeded in the last 6 hours
      # (data/status.json "last_success", written by every good collection).
      - name: Backup slot check
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && { [ "${{ github.event.schedule }}" = "41 9 * * *" ] || [ "${{ github.event.schedule }}" = "41 21 * * *" ]; }; then
            python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from datetime import datetime, timezone
          last = json.load(open("data/status.json")).get("last_success")
          age = (datetime.now(timezone.utc) - datetime.fromisoformat(last.replace("Z", "+00:00"))).total_seconds() / 3600 if last else None
          skip = age is not None and age < 6
          print("skip=%s" % ("true" if skip else "false"))
          import sys
          print("backup slot: last success %s (%s h ago): %s" % (last, "%.1f" % age if age is not None else "?", "skipping" if skip else "running"), file=sys.stderr)
          PY
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.skip != 'true'
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.gate.outputs.skip != 'true'
        run: pip install -r requirements.txt

      - name: Full yt-dlp listing (Mondays or when a week old; or when asked)
        if: github.event_name != 'push' && steps.gate.outputs.skip != 'true'
        continue-on-error: true
        run: |
          if [ "${{ inputs.listing }}" = "true" ]; then
            python -m pp weekly || echo "::warning::yt-dlp listing failed; keeping the last good data"
          else
            python -m pp weekly-if-due || echo "::warning::yt-dlp listing failed; keeping the last good data"
          fi
          python - <<'PY'
          import json
          s = json.load(open("data/status.json")).get("ytdlp", {})
          if s.get("blocked"):
              print("::warning::YouTube blocked the yt-dlp listing from this server; last good listing: %s" % s.get("last_ok"))
          else:
              print("yt-dlp listing: last %s, %s sources read, %s with errors" % (s.get("last_attempt"), s.get("sources_ok"), s.get("sources_with_errors")))
          PY

      - name: Daily feeds and 90-day listing
        if: github.event_name != 'push' && steps.gate.outputs.skip != 'true'
        run: python -m pp daily

      - name: Tests
        if: steps.gate.outputs.skip != 'true'
        run: python -m pytest -q

      - name: Build site
        if: steps.gate.outputs.skip != 'true'
        run: python -m pp build

      - name: Commit data
        if: always() && steps.gate.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --staged --quiet; then
            echo "No data changes."
            exit 0
          fi
          git commit -q -m "data: $(date -u '+%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          echo "::error::could not push data"
          exit 1

      - name: Upload site
        if: steps.gate.outputs.skip != 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: update
    if: needs.update.outputs.skip != 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
